name: CI

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        working-directory: backend
        run: ruff check src/ tests/

      - name: Type check with mypy
        working-directory: backend
        run: mypy src/dev_guardian/harness/ src/dev_guardian/skills/
        continue-on-error: true

      - name: Run unit tests (no live APIs)
        working-directory: backend
        env:
          GROQ_API_KEY: "test-key-not-real"
        run: |
          pytest tests/unit/ \
            tests/integration/test_mcp_client_contract.py \
            tests/integration/test_embedded_stores.py -v \
            -m "not integration and not llm" \
            --tb=short \
            --cov=src/dev_guardian/harness \
            --cov=src/dev_guardian/skills \
            --cov-report=term-missing \
            --cov-fail-under=60

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test

    services:
      memgraph:
        image: memgraph/memgraph:latest
        ports:
          - 7687:7687

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run integration tests
        working-directory: backend
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MEMGRAPH_HOST: localhost
          MEMGRAPH_PORT: 7687
        run: |
          pytest tests/integration/ -v \
            -m "integration and not llm" \
            --tb=short
        continue-on-error: true
