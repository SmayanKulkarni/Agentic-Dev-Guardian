name: Docs Sync Gate

# Ticket 6: gates GUARDIAN_WIKI.md against HEAD without ever generating docs
# in CI (docs generation needs an indexed repository). Regeneration stays
# local: run `dev-guardian index .` then `dev-guardian docs .`, commit the
# updated wiki, and push — this job only checks the SHA already embedded in
# the wiki.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docs-status:
    name: Check GUARDIAN_WIKI.md freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install agentic-dev-guardian from PyPI
        run: pip install agentic-dev-guardian

      - name: Check docs staleness
        run: |
          if ! dev-guardian docs-status .; then
            echo "::error::GUARDIAN_WIKI.md is stale. Run 'dev-guardian index . && dev-guardian docs .' locally, commit the updated wiki, and push."
            exit 1
          fi
