name: Release

# Ticket 08 release policy:
#   * Trigger: pushing an annotated tag `vX.Y.Z`. hatch-vcs derives the version
#     from that tag; an untagged build carries a local segment (`+g<sha>`) that
#     PyPI rejects outright, so tags are the only publishable state.
#   * `fetch-depth: 0` is mandatory — a shallow clone hides tags from hatch-vcs.
#   * Gates: unit tests and ruff must pass, and the built wheel must install
#     into a clean environment and run. A wheel missing its packaged prompts
#     (the ticket 03 failure mode) fails the smoke job, not the user.
#   * Publishing uses PyPI Trusted Publishing (OIDC) — no long-lived token.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    name: Gate — lint + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          ./scripts/prepare_package_files.sh
          pip install -e ".[dev]"

      - name: Lint with ruff
        working-directory: backend
        run: ruff check src/ tests/

      - name: Run unit tests
        working-directory: backend
        env:
          GROQ_API_KEY: "test-key-not-real"
        run: >-
          pytest tests/unit/ tests/integration/test_mcp_client_contract.py
          -m "not integration and not llm" --tb=short

  build:
    name: Build sdist + wheel
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # hatch-vcs needs the tag history

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build
        working-directory: backend
        run: |
          python -m pip install --upgrade pip build
          ./scripts/prepare_package_files.sh
          python -m build --outdir ../dist

      - name: Reject a non-releasable version
        run: |
          python - <<'PY'
          import pathlib, sys
          names = [p.name for p in pathlib.Path("dist").glob("*.whl")]
          assert names, "no wheel built"
          if any("+" in n or ".dev" in n for n in names):
              sys.exit(f"Refusing to publish a dev/local version: {names}")
          print("version ok:", names)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  smoke:
    name: Smoke — install the wheel in a clean env
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install and run
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --upgrade pip
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/dev-guardian version
          # The packaged prompts must resolve from site-packages (ticket 03).
          /tmp/smoke/bin/python - <<'PY'
          from dev_guardian.harness.prompt_registry import PromptRegistry
          ids = PromptRegistry().list()
          assert "gatekeeper" in ids, f"prompts missing from wheel: {ids}"
          print("prompts ok:", len(ids))
          PY

  publish:
    name: Publish to PyPI
    needs: smoke
    runs-on: ubuntu-latest
    environment: pypi # manual approval gate, configured on the repo
    permissions:
      id-token: write # OIDC token for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
